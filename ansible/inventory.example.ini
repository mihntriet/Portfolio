# Copy this file to inventory.ini and replace all placeholders.
# inventory.ini is ignored by Git. Generate the private key in WSL, outside this repository.
[portfolio]
portfolio-ec2 ansible_host=EC2_PUBLIC_DNS_OR_IP ansible_user=ec2-user ansible_ssh_private_key_file=/home/YOUR_WSL_USER/.ssh/portfolio-ec2 ansible_python_interpreter=/usr/bin/python3
